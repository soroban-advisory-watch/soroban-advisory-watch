name: Bug report
description: The tool crashed, gave a wrong result, or behaved differently from the docs.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: do not file here. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: advisory-watch version
      description: Output of `advisory-watch --version`
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: Wasm hash, contract id and network, or a minimal inventory file.
