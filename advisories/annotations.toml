# Notes that this project adds to upstream advisories.
#
# The OSV files in advisories/osv/ are copied unchanged from the GitHub
# Advisory Database. Anything we want to say about an advisory goes here.
#
# Fields:
#   id         GHSA id of the advisory.
#   condition  What else must be true, beyond the version, for a contract to
#              be affected. Quote or paraphrase the advisory; do not guess.
#   signals    Ids from crates/core/src/signals.rs. A signal adds context to
#              a result. It never changes the result's status.

[[advisory]]
id = "GHSA-96xm-fv9w-pf3f"
condition = """
Only contracts built with `overflow-checks = false` are affected, and only if \
they pass user-controlled or computed bounds to `Bytes::slice`, `Vec::slice` \
or `Prng::gen_range` (u64). `stellar contract init` and the official examples \
set `overflow-checks = true` for release builds. The Wasm does not record this \
flag."""
signals = []

[[advisory]]
id = "GHSA-x2hw-px52-wp4m"
condition = """
Only contracts that accept `Fr` values (BN254 or BLS12-381 scalar field) from \
callers and compare them with `==`, `!=` or `assert_eq!` without first going \
through host-side arithmetic are affected."""
signals = ["imports-pairing-curve-host-functions"]

[[advisory]]
id = "GHSA-4chv-4c6w-w254"
condition = """
Only contracts that apply `#[contractimpl]` to an `impl Trait for Contract` \
block and also define an inherent `impl Contract` function with the same name \
are affected. The bug is in `soroban-sdk-macros`. Wasm metadata records the \
`soroban-sdk` version, and `soroban-sdk` requires `soroban-sdk-macros` with a \
caret range, so the macros version is only known to be at least the SDK \
version. The fix requires recompiling and upgrading the contract."""
signals = []

[[advisory]]
id = "GHSA-pm4j-7r4q-ccg8"
condition = """
Bug in the Soroban host (`soroban-env-host`), fixed in protocol 26. It is not \
part of contract Wasm, so contract scans skip it."""
signals = []

[[advisory]]
id = "GHSA-x5m4-43jf-hh65"
condition = """
Affects contracts that depend on `soroban-fixed-point-math` 1.3.0 or 1.4.0 and \
use signed fixed-point division or `i64` `mulDiv`. Wasm metadata does not \
record this crate's version, so a Wasm-only scan reports `unknown`. Check the \
contract's `Cargo.lock` instead."""
signals = []
