[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]
exclude = ["fixtures/contracts"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/soroban-advisory-watch/soroban-advisory-watch"
homepage = "https://github.com/soroban-advisory-watch/soroban-advisory-watch"
keywords = ["soroban", "stellar", "security", "advisory", "wasm"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
advisory-watch-core = { path = "crates/core", version = "0.1.0" }
base64 = "0.22"
hex = "0.4"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stellar-strkey = "1"
stellar-xdr = { version = "30", default-features = false, features = ["std", "base64"] }
thiserror = "2"
toml = "0.8"
wasmparser = "0.263"
