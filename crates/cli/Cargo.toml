[package]
name = "soroban-advisory-watch"
description = "Find deployed Soroban contracts that may be affected by soroban-sdk security advisories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "advisory-watch"
path = "src/main.rs"

[dependencies]
advisory-watch-core.workspace = true
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
stellar-strkey.workspace = true
stellar-xdr.workspace = true
tempfile = "3"
